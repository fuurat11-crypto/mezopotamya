<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2e2925" />
    <meta name="robots" content="index, follow" />
    <meta name="description" content="Mezopotamya Bestattung & Überführung in Hagen – 24/7 persönliche Begleitung bei islamischen und kurdischen Bestattungen sowie internationalen Überführungen." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Mezopotamya Bestattung & Überführung | Hagen</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Falls die App beim Start abstürzt: Fehler anzeigen statt leerer Seite
      window.addEventListener("error", function (e) {
        var root = document.getElementById("root");
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="font-family:system-ui;padding:24px;max-width:560px;margin:40px auto"><h1 style="font-size:20px">Die Seite konnte nicht geladen werden</h1><p>Bitte Screenshot an den Support schicken:</p><pre style="white-space:pre-wrap;background:#fef2f2;color:#991b1b;padding:12px;border-radius:8px"></pre></div>';
          root.querySelector("pre").textContent = (e.message || "Fehler") + (e.filename ? "\n" + e.filename + ":" + e.lineno : "");
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
